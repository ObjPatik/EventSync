# ========================================================================
# EventSync: Spring Boot Configuration for Supabase PostgreSQL
# CIT-U IT342 - Systems Integration and Architecture 1
# ========================================================================

server.port=8080

# Supabase PostgreSQL Connection (Transaction Pooler Port 6543 or Direct Port 5432)
# Replace [your-project-ref] and [your-password] with your Supabase credentials
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:${SUPABASE_DB_PORT:6543}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER:postgres.yourprojectref}
spring.datasource.password=${SUPABASE_DB_PASSWORD:yourpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SendGrid Configuration (FR-012, FR-013)
sendgrid.api-key=${SENDGRID_API_KEY:SG.mock_or_real_key}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:tickets@eventsync.ph}

# CORS Configuration for React Frontend
cors.allowed-origins=http://localhost:5173,http://localhost:3000
